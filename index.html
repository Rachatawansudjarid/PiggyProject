<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wellbeing Check-in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg: #F5F7F3;
    --card: #FFFFFF;
    --ink: #202A24;
    --ink-soft: #5B685F;
    --teal: #2F6F62;
    --teal-deep: #1F4B41;
    --gold: #C99A3B;
    --clay: #C1613F;
    --line: #E2E7DF;
    --shadow: 0 20px 50px -25px rgba(31,75,65,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  #wb-root{
    min-height: 100vh;
    width: 100%;
    padding: 40px 16px 60px;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }
  #wb-root::before{
    content:"";
    position:absolute; top:-120px; right:-120px;
    width:340px; height:340px; border-radius:50%;
    background: radial-gradient(circle, rgba(47,111,98,0.14), transparent 70%);
    pointer-events:none;
  }
  .wb-shell{ width:100%; max-width:600px; position:relative; z-index:1; }
  .wb-shell.wide{ max-width:920px; }
  .wb-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--teal-deep); font-weight:600; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .wb-pulse{
    width:8px; height:8px; border-radius:50%; background: var(--teal);
    animation: wbBreathe 3.2s ease-in-out infinite;
  }
  @keyframes wbBreathe{
    0%,100%{ transform: scale(1); opacity:.6; }
    50%{ transform: scale(1.9); opacity:1; }
  }
  .wb-h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600; font-size:32px; line-height:1.15;
    margin:0 0 8px; color: var(--teal-deep);
  }
  .wb-sub{ color: var(--ink-soft); font-size:15px; line-height:1.5; margin:0 0 28px; max-width:46ch; }
  .wb-card{
    background: var(--card); border:1px solid var(--line); border-radius:18px;
    padding:32px; box-shadow: var(--shadow);
  }
  .wb-label{ font-size:13px; font-weight:600; color:var(--ink); margin-bottom:8px; display:block; }
  .wb-input{
    width:100%; padding:14px 16px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:16px; letter-spacing:.03em;
    background:#FBFCFA; color:var(--ink); outline:none; transition: border-color .15s;
  }
  .wb-input:focus{ border-color: var(--teal); }
  .wb-search{ position:relative; }
  .wb-results{ margin-top:8px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .wb-result{ display:flex; flex-direction:column; align-items:flex-start; width:100%; padding:12px 14px; border:0; border-bottom:1px solid var(--line); background:#fff; color:var(--ink); text-align:left; cursor:pointer; }
  .wb-result:last-child{ border-bottom:0; }
  .wb-result:hover{ background:#EEF5F2; }
  .wb-result .name{ font-size:14px; font-weight:600; }
  .wb-result .id{ margin-top:3px; color:var(--ink-soft); font:12px 'IBM Plex Mono',monospace; }
  .wb-search-status{ min-height:18px; margin-top:8px; color:var(--ink-soft); font-size:13px; }
  .wb-textarea{
    width:100%; min-height:90px; padding:14px 16px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Inter',sans-serif; font-size:14.5px; background:#FBFCFA; color:var(--ink);
    outline:none; resize:vertical; transition: border-color .15s; line-height:1.5;
  }
  .wb-textarea:focus{ border-color: var(--teal); }
  .wb-btn{
    appearance:none; border:none; cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14.5px; padding:13px 24px; border-radius:10px;
    background: var(--teal); color:#fff; transition: transform .12s, background .15s;
  }
  .wb-btn:hover{ background: var(--teal-deep); }
  .wb-btn:active{ transform: scale(.97); }
  .wb-btn:disabled{ background:#B7C2BB; cursor:not-allowed; }
  .wb-btn.ghost{ background:transparent; color:var(--teal-deep); border:1.5px solid var(--line); }
  .wb-btn.ghost:hover{ background:#F0F3EE; }
  .wb-row{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px; }
  .wb-error{ color: var(--clay); font-size:13px; margin-top:10px; min-height:16px; }

  .wb-trail{ display:flex; gap:6px; margin-bottom:26px; }
  .wb-dot{ height:5px; flex:1; border-radius:3px; background: var(--line); transition: background .2s; }
  .wb-dot.done{ background: var(--teal); }
  .wb-dot.active{ background: var(--gold); }

  .wb-qnum{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .wb-q{ font-family:'Fraunces', Georgia, serif; font-size:22px; font-weight:600; color:var(--ink); margin:0 0 22px; line-height:1.35; }
  .wb-question-table-wrap{ overflow-x:auto; margin-top:8px; }
  table.wb-question-table{ width:100%; min-width:760px; border-collapse:collapse; font-size:13px; }
  table.wb-question-table th, table.wb-question-table td{ border-bottom:1px solid var(--line); padding:12px 8px; }
  table.wb-question-table th{ background:#F0F3EE; color:var(--ink-soft); font-size:11px; font-weight:600; line-height:1.35; text-align:center; vertical-align:bottom; }
  table.wb-question-table th:first-child{ width:43%; text-align:left; }
  table.wb-question-table td:first-child{ color:var(--ink); line-height:1.45; padding-left:0; padding-right:18px; }
  table.wb-question-table td:not(:first-child){ text-align:center; }
  table.wb-question-table tr:last-child td{ border-bottom:0; }
  .wb-choice{ width:20px; height:20px; accent-color:var(--teal); cursor:pointer; }
  .wb-choice-label{ display:flex; align-items:center; justify-content:center; min-height:30px; cursor:pointer; }
  .wb-scale{ display:flex; flex-direction:column; gap:8px; }
  .wb-opt{
    display:flex; align-items:center; gap:14px; padding:13px 16px; border-radius:10px;
    border:1.5px solid var(--line); cursor:pointer; transition: border-color .15s, background .15s;
    background:#FBFCFA;
  }
  .wb-opt:hover{ border-color:#BFD3CC; }
  .wb-opt.sel{ border-color: var(--teal); background: #EEF5F2; }
  .wb-opt .n{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-soft); flex-shrink:0; background:#fff;
  }
  .wb-opt.sel .n{ border-color:var(--teal); background:var(--teal); color:#fff; }
  .wb-opt .t{ font-size:14.5px; color:var(--ink); }
  .wb-yn{ display:flex; gap:10px; }
  .wb-yn .wb-opt{ flex:1; justify-content:center; }

  .wb-done-wrap{ text-align:center; padding:20px 6px; }
  .wb-done-icon{
    width:56px; height:56px; border-radius:50%; margin:0 auto 20px; background: var(--teal);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px;
  }
  .wb-done-icon.error{ background: var(--clay); }
  .wb-note{
    margin-top:22px; padding:16px 18px; background:#FBF6EC; border:1px solid #EAD9AE;
    border-radius:12px; font-size:13.5px; color:#6B551F; line-height:1.55; text-align:left;
  }

  /* HR dashboard */
  .wb-stats{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .wb-stat{ flex:1; min-width:130px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .wb-stat .v{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--teal-deep); }
  .wb-stat .l{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .wb-chart-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:22px; box-shadow:var(--shadow); }
  .wb-chart-title{ font-family:'Fraunces',serif; font-size:20px; color:var(--teal-deep); margin:0 0 4px; }
  .wb-chart-subtitle{ color:var(--ink-soft); font-size:12.5px; margin:0 0 20px; }
  .wb-chart{ display:flex; align-items:flex-end; gap:14px; min-height:280px; padding:20px 8px 0; border-bottom:1px solid var(--line); background:repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), #E2E7DF calc(25% - 1px), #E2E7DF 25%); }
  .wb-chart-row{ display:flex; flex:1; min-width:72px; height:260px; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; }
  .wb-chart-row{ cursor:pointer; }
  .wb-chart-row:hover .wb-chart-bar{ background:var(--teal-deep); }
  .wb-chart-label{ order:3; width:100%; font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .wb-chart-track{ order:2; display:flex; align-items:flex-end; width:100%; height:210px; background:transparent; border-radius:5px 5px 0 0; overflow:hidden; }
  .wb-chart-bar{ width:100%; min-height:3px; background:var(--teal); border-radius:5px 5px 0 0; }
  .wb-chart-value{ order:1; font:12px 'IBM Plex Mono',monospace; color:var(--ink-soft); text-align:center; white-space:nowrap; }
  .wb-chart-empty{ color:var(--ink-soft); font-size:13px; }
  .wb-chart-scale{ display:flex; justify-content:space-between; color:var(--ink-soft); font:11px 'IBM Plex Mono',monospace; margin:5px 8px 0; }
  .wb-hse-profile{ display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:center; margin-top:14px; }
  .wb-donut{ width:210px; height:210px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#E2E7DF; }
  .wb-donut-hole{ width:112px; height:112px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px; }
  .wb-donut-hole strong{ font:600 20px 'Fraunces',serif; color:var(--teal-deep); }
  .wb-donut-hole span{ color:var(--ink-soft); font-size:11px; line-height:1.3; }
  .wb-hse-legend{ display:flex; flex-direction:column; gap:8px; }
  .wb-hse-legend-row{ display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:center; font-size:12.5px; }
  .wb-hse-swatch{ width:10px; height:10px; border-radius:50%; }
  .wb-hse-legend-score{ color:var(--ink-soft); font:11px 'IBM Plex Mono',monospace; }
  .wb-hse-risk{ font-size:11px; color:var(--ink-soft); grid-column:2 / 4; margin-top:-5px; }
  .wb-modal-note{ color:var(--ink-soft); font-size:12.5px; line-height:1.5; margin:14px 0 0; }
  @media (max-width:640px){
    .wb-hse-profile{ grid-template-columns:1fr; justify-items:center; }
    .wb-hse-legend{ width:100%; }
  }
  .wb-table-wrap{ background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow: var(--shadow); }
  table.wb-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.wb-table th{
    text-align:left; padding:14px 16px; background:#F0F3EE; color:var(--ink-soft);
    font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }
  table.wb-table td{ padding:14px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.wb-table tr:last-child td{ border-bottom:none; }
  table.wb-table tr.clickable{ cursor:pointer; transition: background .12s; }
  table.wb-table tr.clickable:hover{ background:#F7F9F6; }
  .wb-flag{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .wb-flag.warn{ background:#FBEDE6; color:var(--clay); }
  .wb-flag.ok{ background:#EAF3EE; color:var(--teal-deep); }
  .wb-empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px; }

  .wb-modal-bg{ position:fixed; inset:0; background:rgba(20,30,25,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .wb-modal{ background:#fff; border-radius:16px; max-width:520px; width:100%; max-height:82vh; overflow-y:auto; padding:28px; }
  .wb-modal h3{ font-family:'Fraunces',serif; margin:0 0 4px; font-size:20px; color:var(--teal-deep); }
  .wb-modal .meta{ font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; font-family:'IBM Plex Mono',monospace; }
  .wb-ans{ padding:12px 0; border-bottom:1px solid var(--line); }
  .wb-ans:last-child{ border-bottom:none; }
  .wb-ans .q{ font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  .wb-ans .a{ font-size:14.5px; color:var(--ink); font-weight:500; }
  .wb-close{ margin-top:20px; width:100%; }
  .wb-back{ font-size:12.5px; color:var(--ink-soft); cursor:pointer; margin-bottom:16px; display:inline-flex; align-items:center; gap:5px; }
  .wb-back:hover{ color:var(--teal-deep); }
  @media (max-width:640px){
    .wb-card{ padding:22px 16px; }
    table.wb-question-table{ min-width:700px; }
    table.wb-question-table th:first-child{ width:38%; }
    .wb-chart{ gap:8px; padding-left:2px; padding-right:2px; }
    .wb-chart-row{ min-width:52px; }
    .wb-chart-label{ font-size:10px; }
  }
</style>
</head>
<body>
<div id="wb-root">
  <div class="wb-shell" id="wb-shell"></div>
</div>

<script>
(function(){
  const shell = document.getElementById('wb-shell');

  const QUESTIONS = [
    { id:'pss1', q:'ใน 1 เดือนที่ผ่านมา คุณรู้สึกอารมณ์เสียกับเรื่องที่เกิดขึ้น โดยไม่คาดคิดบ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss2', q:' ใน 1 เดือนที่ผ่านมา คุณรู้สึกว่าไม่สามารถควบคุมสิ่งที่มีความสำคัญในชีวิตได้ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss3', q:'ใน 1 เดือนที่ผ่านมา  คุณรู้สึกกระวนกระวายและเครียดบ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss4', q:'ใน 1 เดือนที่ผ่านมา คุณรู้สึกเชื่อมั่นกับความสามารถในการแก้ปัญหาส่วนตัวได้ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss5', q:'ใน 1 เดือนที่ผ่านมา คุณรู้สึกว่าสิ่งต่างๆเป็นไปตามที่คุณต้องการ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss6', q:'ใน 1 เดือนที่ผ่านมา คุณพบว่าคุณไม่สามารถเผชิญกับทุกสิ่งที่คุณต้องทำได้ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss7', q:'ใน 1 เดือนที่ผ่านมา คุณสามารถควบคุมสิ่งที่รบกวนชีวิตของคุณได้บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss8', q:'ใน 1 เดือนที่ผ่านมา  คุณรู้สึกว่า คุณสามารถทำทุกสิ่งทุกอย่างได้ตามที่กำหนด บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss9', q:'ใน 1 เดือนที่ผ่านมา คุณรู้สึกโกรธเพราะสิ่งที่เกิดขึ้นอยู่นอกเหนือการควบคุมของคุณ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] },
    { id:'pss10', q:'ใน 1 เดือนที่ผ่านมา คุณรู้สึกว่าความยุ่งยากมีมากจนคุณไม่สามารถเอาชนะมันได้ บ่อยแค่ไหน', type:'scale', labels:['ไม่เคย','ค่อนข้างไม่','บางครั้ง','ค่อนข้างบ่อย','บ่อยมาก'] }
  ];

  const HSE_QUESTIONS = [
    'ฉันเข้าใจอย่างชัดเจนว่าที่ทำงานคาดหวังอะไรจากฉัน',
    'ฉันสามารถตัดสินใจได้ว่าจะพักเมื่อใด',
    'คนจากหลายกลุ่มในที่ทำงานเรียกร้องสิ่งต่าง ๆ จากฉันจนยากที่จะจัดการให้สอดคล้องกัน',
    'ฉันรู้ว่าควรดำเนินการอย่างไรเพื่อทำงานให้สำเร็จ',
    'ฉันถูกคุกคามหรือรบกวนเป็นการส่วนตัวด้วยคำพูดหรือพฤติกรรมที่ไม่ดี',
    'ฉันได้รับมอบหมายกำหนดเวลาที่ไม่สามารถทำให้สำเร็จได้',
    'เมื่อการทำงานยากขึ้น เพื่อนร่วมงานจะช่วยเหลือฉัน',
    'ฉันได้รับคำแนะนำหรือข้อเสนอแนะที่ช่วยสนับสนุนการทำงานของฉัน',
    'ฉันต้องทำงานอย่างหักโหมมาก',
    'ฉันมีส่วนร่วมในการกำหนดความเร็วในการทำงานของตนเอง',
    'ฉันเข้าใจหน้าที่และความรับผิดชอบของตนเองอย่างชัดเจน',
    'ฉันต้องละเลยงานบางอย่างเพราะมีงานมากเกินไป',
    'ฉันเข้าใจเป้าหมายและวัตถุประสงค์ของแผนกอย่างชัดเจน',
    'มีความขัดแย้งหรือความโกรธระหว่างเพื่อนร่วมงาน',
    'ฉันมีทางเลือกในการตัดสินใจว่าจะทำงานอย่างไร',
    'ฉันไม่สามารถหยุดพักได้อย่างเพียงพอ',
    'ฉันเข้าใจว่างานของฉันสอดคล้องกับเป้าหมายโดยรวมขององค์กรอย่างไร',
    'ฉันถูกกดดันให้ทำงานเป็นเวลานาน',

  const HSE_LABELS = {
    frequency:['ไม่เคย','นาน ๆ ครั้ง','บางครั้ง','บ่อยครั้ง','สม่ำเสมอ'],
    agreement:['ไม่เห็นด้วยอย่างยิ่ง','ไม่เห็นด้วย','เป็นกลาง','เห็นด้วย','เห็นด้วยอย่างยิ่ง']
  };
  const HSE_DIMENSIONS = {
    Demands:[3,6,9,12,16,18,20,22],
    Control:[2,10,15,19,25,30],
    Support:[7,8,23,24,29,31,33,35],
    Relationships:[5,14,21,27,34],
    Role:[1,4,11,13,17],
    Change:[26,28,32]
  };
  const HSE_REVERSE = new Set([3,5,6,9,12,14,16,18,20,21,22,34]);

  let state = {
    screen: 'entry',   // entry | checking | quiz | done | error | hr
    empId: '',
    empName: '',
    department: '',
    employeeMatches: [],
    step: 0,
    answers: {},
    hseAnswers: {},
    error: '',

  function render(){
    shell.innerHTML = '';
    // The detail modal is appended outside #wb-shell, so clearing shell alone
    // doesn't remove it — clean up any leftover modal on every render.
    document.querySelectorAll('.wb-modal-bg').forEach(node => node.remove());
    SCREENS[state.screen]();
  }
  function set(patch){ Object.assign(state, patch); render(); }

  function reversePssScore(value){
    return 4 - value;
  }

  function pssScore(answers){
    const reverseKeys = new Set(['pss4','pss5','pss7','pss8']);
    const keys = ['pss1','pss2','pss3','pss4','pss5','pss6','pss7','pss8','pss9','pss10'];
    let total = 0;
    keys.forEach((key)=>{
      const value = Number(answers && answers[key]);
      if(Number.isFinite(value)){
        total += reverseKeys.has(key) ? reversePssScore(value) : value;
      }
    });
    return total;
  }

  function pssBand(score){
    if(score <= 13) return 'Low stress';
    if(score <= 26) return 'Moderate stress';
    return 'High stress';
  }

  function hseScores(answers){
    const scores = {};
    Object.entries(HSE_DIMENSIONS).forEach(([dimension, questionNumbers])=>{
      const values = questionNumbers.map(number=>{
        const value = Number(answers && answers[`hse${number}`]);
        return HSE_REVERSE.has(number) ? 6 - value : value;
      }).filter(Number.isFinite);
      scores[dimension] = values.length ? values.reduce((sum, value)=>sum + value, 0) / values.length : 0;
    });
    return scores;
  }

  function hseRisk(score){
    if(score >= 4.5) return 'Achieving the Management Standard';
    if(score >= 4) return 'Good';
    if(score >= 3) return 'Moderate';
    if(score >= 2) return 'Low';
    return 'Poor';
  }

  function hseOverall(scores){
    const values = Object.values(scores).filter(Number.isFinite);
    return values.length ? values.reduce((sum, value)=>sum + value, 0) / values.length : 0;
  }

  function thaiPssBand(score){
    if(score <= 13) return 'ความเครียดระดับต่ำ';
    if(score <= 26) return 'ความเครียดระดับปานกลาง';
    return 'ความเครียดระดับสูง';
  }

  function thaiHseRisk(score){
    if(score >= 4.5) return 'บรรลุมาตรฐานการจัดการ';
    if(score >= 4) return 'ดี';
    if(score >= 3) return 'ปานกลาง';
    if(score >= 2) return 'ต่ำ';
    return 'ควรปรับปรุง';
  }

  const THAI_HSE_DIMENSIONS = {
    Demands:'ภาระงานและสภาพแวดล้อม',
    Control:'อิสระและการควบคุมงานของตนเอง',
    Support:'การสนับสนุน',
    Relationships:'ความสัมพันธ์ในการทำงาน',
    Role:'ความชัดเจนในบทบาทและหน้าที่',
    Change:'การสื่อสารการเปลี่ยนแปลง'
  };

  // ---------- ENTRY SCREEN ----------
  function screenEntry(){
    const wrap = el('div');
    wrap.appendChild(eyebrow('แบบทดสอบทางสุขภาพจิตของพนักงาน'));
    wrap.appendChild(h1('ใช้เวลาเพียงไม่กี่นาทีเพื่อความเป็นอยู่ที่ดีของคุณ'));
    wrap.appendChild(sub('ค้นหาเลขประจำตัวพนักงานหรือชื่อภาษาอังกฤษของคุณเพื่อเริ่มต้นแบบทดสอบ'));

    const card = el('div','wb-card');
    const label = el('label','wb-label'); label.textContent='ค้นหาพนักงาน'; label.setAttribute('for','wb-id-input');
    const search = el('div','wb-search');
    const input = document.createElement('input');
    input.className='wb-input'; input.id='wb-id-input'; input.placeholder='พิมพ์ชื่อภาษาอังกฤษหรือรหัสพนักงาน'; input.autocomplete='off';
    input.value = state.empName || state.empId;
    input.addEventListener('input', e=>{ searchEmployees(e.target.value); });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') startFlow(); });

    const err = el('div','wb-error'); err.textContent = state.error;
    const status = el('div','wb-search-status');
    const results = el('div','wb-results');
    search.appendChild(input); search.appendChild(results); card.appendChild(label); card.appendChild(search); card.appendChild(status); card.appendChild(err);

    const row = el('div','wb-row');
    const spacer = el('div'); spacer.style.flex='1';
    const btn = el('button','wb-btn'); btn.textContent='ต่อไป';
    btn.addEventListener('click', startFlow);

    row.appendChild(spacer); row.appendChild(btn); card.appendChild(row);
    wrap.appendChild(card);
    shell.appendChild(wrap);
    input.focus();

    let searchTimer;
    async function searchEmployees(value){
      state.empId = ''; state.empName = ''; state.employeeMatches = [];
      clearTimeout(searchTimer);
      results.innerHTML = '';
      const query = value.trim();
      if(query.length < 2){ status.textContent = query ? 'พิมพ์อย่างน้อย 2 ตัวอักษร' : ''; return; }
      status.textContent = 'กำลังค้นหา...';
      searchTimer = setTimeout(async ()=>{
        try{
          const res = await fetch(`/api/employees?q=${encodeURIComponent(query)}`);
          if(!res.ok) throw new Error('employee search failed');
          const data = await res.json();
          state.employeeMatches = data.employees || [];
          status.textContent = state.employeeMatches.length ? '' : 'ไม่พบพนักงานที่ตรงกัน';
          state.employeeMatches.forEach(employee=>{
            const option = el('button','wb-result'); option.type='button';
            const name = el('span','name'); name.textContent = employee.name;
            const id = el('span','id'); id.textContent = employee.id;
            option.appendChild(name); option.appendChild(id);
            option.addEventListener('click', ()=>{
              state.empId = employee.id; state.empName = employee.name; state.department = employee.department || '';
              input.value = employee.name; results.innerHTML = ''; status.textContent = `${employee.name} - ${employee.id}`;
            });
            results.appendChild(option);
          });
        }catch(e){ status.textContent = 'การค้นหาพนักงานไม่สามารถใช้งานได้ในขณะนี้'; }
      }, 250);
    }

    async function startFlow(){
      if(!state.empId){ set({error:'กรุณาเลือกบันทึกพนักงานจากรายการค้นหา'}); return; }
      set({ screen:'checking' });
      // The server decides whether this ID is HR \u2014 nothing HR-specific lives in this file.
      try{
        const res = await fetch(`/api/responses?hrId=${encodeURIComponent(state.empId)}`);
        if(res.ok){
          const data = await res.json();
          shell.classList.add('wide');
          set({ screen:'hr', hrData: data.records || [] });
          return;
        }
      }catch(e){ /* network hiccup: fall through and treat as an employee */ }
      set({ screen:'quiz', step:0, answers:{}, error:'' });
    }
  }

  function screenHse(){
    const wrap = el('div');
    wrap.appendChild(eyebrow('แบบประเมินมาตรฐาน HSE · ' + state.empId));
    wrap.appendChild(h1('แบบประเมินสภาพการทำงาน'));
    wrap.appendChild(sub('โปรดตอบคำถามโดยพิจารณาจากการทำงานของคุณในช่วง 6 เดือนที่ผ่านมา'));

    const card = el('div','wb-card');
    const qnum = el('div','wb-qnum'); qnum.textContent = 'ตอบคำถามให้ครบทั้ง 35 ข้อ';
    const qtext = el('div','wb-q'); qtext.textContent = 'เลือกคำตอบหนึ่งรายการสำหรับแต่ละข้อความ';
    card.appendChild(qnum); card.appendChild(qtext);

    const tableWrap = el('div','wb-question-table-wrap');
    function appendHseTable(questions, labels){
      const table = document.createElement('table'); table.className='wb-question-table';
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const questionHeader = document.createElement('th'); questionHeader.textContent = 'ข้อความ'; headerRow.appendChild(questionHeader);
      labels.forEach(labelText=>{
        const th = document.createElement('th'); th.textContent = labelText; headerRow.appendChild(th);
      });
      thead.appendChild(headerRow); table.appendChild(thead);
      const tbody = document.createElement('tbody');
      questions.forEach(question=>{
        const row = document.createElement('tr');
        const questionCell = document.createElement('td');
        questionCell.textContent = `${Number(question.id.slice(3))}. ${question.q}`;
        row.appendChild(questionCell);
        labels.forEach((labelText, value)=>{
          const cell = document.createElement('td');
          const label = el('label','wb-choice-label');
          const input = document.createElement('input');
          input.className='wb-choice'; input.type='radio'; input.name=question.id;
          input.value = value + 1; input.checked = Number(state.hseAnswers[question.id]) === value + 1;
          input.setAttribute('aria-label', `${question.q}: ${labelText}`);
          input.addEventListener('change', ()=>{
            state.hseAnswers[question.id] = value + 1;
            submitButton.disabled = !HSE_QUESTIONS.every(item => state.hseAnswers[item.id] !== undefined);
          });
          label.appendChild(input); cell.appendChild(label); row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
      table.appendChild(tbody); tableWrap.appendChild(table);
    }
    appendHseTable(HSE_QUESTIONS.slice(0,23), HSE_LABELS.frequency);
    const agreementNote = el('div','wb-qnum'); agreementNote.textContent = 'ข้อ 24–35: โปรดใช้ระดับความคิดเห็น'; agreementNote.style.marginTop='24px'; tableWrap.appendChild(agreementNote);
    appendHseTable(HSE_QUESTIONS.slice(23), HSE_LABELS.agreement);
    card.appendChild(tableWrap);

    const row = el('div','wb-row');
    const back = el('button','wb-btn ghost'); back.textContent = 'ย้อนกลับ';
    back.addEventListener('click', ()=> set({screen:'quiz'}));
    const complete = HSE_QUESTIONS.every(question => state.hseAnswers[question.id] !== undefined);
    const submitButton = el('button','wb-btn'); submitButton.textContent = 'ส่งคำตอบ'; submitButton.disabled = !complete;
    submitButton.addEventListener('click', async ()=>{
      const isComplete = HSE_QUESTIONS.every(question => state.hseAnswers[question.id] !== undefined);
      if(isComplete) await submit();
    });
    row.appendChild(back); row.appendChild(submitButton); card.appendChild(row);
    wrap.appendChild(card); shell.appendChild(wrap);
  }

  async function submit(){
    try{
      const res = await fetch('/api/submit', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ employeeId: state.empId, department: state.department, answers: state.answers, hseAnswers: state.hseAnswers })
      });
      if(!res.ok) throw new Error('submit failed: ' + res.status);
      set({ screen:'done' });
    }catch(err){
      console.error('Error saving check-in:', err);
      set({ screen:'error' });
    }
  }

  function screenHr(){
    const wrap = el('div');

    wrap.appendChild(h1('Employee check-ins'));
    wrap.appendChild(sub('All submitted wellbeing responses, most recent first.'));

    const backLink = el('div','wb-back'); backLink.textContent = '\u2190 Sign out';
    backLink.addEventListener('click', ()=> { shell.classList.remove('wide'); set({ screen:'entry', empId:'', empName:'', error:'' }); });

    const data = state.hrData;
    const total = data.length;
    const flagged = data.filter(r => needsFollowup(r)).length;
    const uniqueEmployees = new Set(data.map(r=>r.employeeId)).size;
    const avgPss = data.length ? (data.reduce((sum, r) => sum + (r.pssScore !== undefined ? r.pssScore : pssScore(r.answers || {})), 0) / data.length).toFixed(1) : '0.0';

    const stats = el('div','wb-stats');
    stats.appendChild(statBox(total, 'Total check-ins'));
    stats.appendChild(statBox(uniqueEmployees, 'Employees'));
    stats.appendChild(statBox(flagged, 'Flagged for follow-up'));
    stats.appendChild(statBox(avgPss, 'Avg. PSS-10'));
    wrap.appendChild(stats);

    const chartCard = el('div','wb-chart-card');
    const chartTitle = el('h2','wb-chart-title'); chartTitle.textContent = 'Company PSS-10 comparison';
    const chartSubtitle = el('p','wb-chart-subtitle'); chartSubtitle.textContent = 'Average stress score for every department in the company · higher scores indicate higher stress';
    const chart = el('div','wb-chart');
    const departmentScores = {};
    data.forEach(record=>{
      const department = record.department || 'Department unavailable';
      const score = record.pssScore !== undefined ? Number(record.pssScore) : pssScore(record.answers || {});
      if(!Number.isFinite(score)) return;
      if(!departmentScores[department]) departmentScores[department] = { total:0, count:0 };
      departmentScores[department].total += score;
      departmentScores[department].count += 1;
    });
    const chartEntries = Object.entries(departmentScores)
      .map(([department, values])=>({ department, average:values.total / values.count, count:values.count }))
      .sort((a,b)=>b.average - a.average);
    if(!chartEntries.length){
      const emptyChart = el('div','wb-chart-empty'); emptyChart.textContent = 'No department data available yet.';
      chart.appendChild(emptyChart);
    } else {
      chartEntries.forEach(entry=>{
        const chartRow = el('div','wb-chart-row');
        const label = el('div','wb-chart-label'); label.textContent = entry.department; label.title = entry.department;
        const track = el('div','wb-chart-track');
        const bar = el('div','wb-chart-bar'); bar.style.height = `${Math.min(100, Math.max(0, entry.average / 40 * 100))}%`;
        track.appendChild(bar);
        const value = el('div','wb-chart-value'); value.textContent = `${entry.average.toFixed(1)} (${entry.count})`;
        chartRow.appendChild(label); chartRow.appendChild(track); chartRow.appendChild(value); chart.appendChild(chartRow);
        chartRow.setAttribute('role','button'); chartRow.tabIndex = 0;
        chartRow.setAttribute('aria-label', `View HSE profile for ${entry.department}`);
        chartRow.addEventListener('click', ()=> renderDepartmentModal(entry.department, data));
        chartRow.addEventListener('keydown', event=>{ if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); renderDepartmentModal(entry.department, data); } });
      });
    }
    const chartScale = el('div','wb-chart-scale');
    chartScale.innerHTML = '<span>0</span><span>10</span><span>20</span><span>30</span><span>40</span>';
    chartCard.appendChild(chartTitle); chartCard.appendChild(chartSubtitle); chartCard.appendChild(chart); chartCard.appendChild(chartScale); wrap.appendChild(chartCard);

    if(!total){
      const card = el('div','wb-table-wrap');
      const p = el('div','wb-empty'); p.textContent = 'No check-ins submitted yet.';
      card.appendChild(p); wrap.appendChild(card);
    } else {
      const tableWrap = el('div','wb-table-wrap');
      const table = document.createElement('table'); table.className='wb-table';
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Employee ID</th><th>Submitted</th><th>PSS-10</th><th>HSE result</th><th>Status</th></tr>';
      const tbody = document.createElement('tbody');
      data.forEach((r)=>{
        const tr = document.createElement('tr'); tr.className='clickable';
        const score = r.pssScore !== undefined ? r.pssScore : pssScore(r.answers || {});
        const hseSummaryResult = hseSummary(r);
        const flag = needsFollowup(r);
        tr.innerHTML = `
          <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(r.employeeId)}</td>
          <td>${formatDate(r.submittedAt)}</td>
          <td>${score !== null ? score + ' / 40' : '\u2014'}</td>
          <td>${hseSummaryResult}</td>
          <td></td>
        `;
        const statusTd = tr.children[4];
        const flagEl = el('span', 'wb-flag ' + (flag ? 'warn' : 'ok'));
        flagEl.textContent = flag ? 'Follow-up' : 'Stable';
        statusTd.appendChild(flagEl);
        tr.addEventListener('click', ()=> set({ hrDetail: r }));
        tbody.appendChild(tr);
      });
      table.appendChild(thead); table.appendChild(tbody);
      tableWrap.appendChild(table);
      wrap.appendChild(tableWrap);
    }

    shell.appendChild(wrap);

    if(state.hrDetail){
      renderDetailModal(state.hrDetail);
    }
  }

  function needsFollowup(r){
    if(r.answers && r.answers.followup === 'Yes') return true;
    const score = r.pssScore !== undefined ? r.pssScore : pssScore(r.answers || {});
    if(score >= 27) return true;
    return Object.values(r.hseRiskLevels || {}).some(level => level === 'Poor' || level === 'Low');
  }

  function hseSummary(record){
    if(!record.hseScores) return '\u2014';
    const scores = Object.values(record.hseScores).filter(Number.isFinite);
    if(!scores.length) return '\u2014';
    const average = scores.reduce((sum, score)=>sum + score, 0) / scores.length;
    const riskLevels = Object.values(record.hseRiskLevels || {});
    const needsAttention = riskLevels.some(level => level === 'Poor' || level === 'Low');
    return `${average.toFixed(2)} / 5 · ${needsAttention ? 'Needs attention' : 'Stable'}`;
  }

  function renderDepartmentModal(department, records){
    const departmentRecords = records.filter(record => (record.department || 'Department unavailable') === department && record.hseAnswers);
    const bg = el('div','wb-modal-bg');
    const modal = el('div','wb-modal');
    const heading = el('h3'); heading.textContent = department;
    const meta = el('div','meta'); meta.textContent = 'HSE workplace stress-risk profile';
    modal.appendChild(heading); modal.appendChild(meta);

    if(!departmentRecords.length){
      const empty = el('div','wb-modal-note'); empty.textContent = 'No HSE responses are available for this department yet.';
      modal.appendChild(empty);
    } else {
      const dimensionTotals = {};
      departmentRecords.forEach(record=>{
        const scores = record.hseScores || hseScores(record.hseAnswers);
        Object.entries(scores).forEach(([dimension, score])=>{
          if(!dimensionTotals[dimension]) dimensionTotals[dimension] = { total:0, count:0 };
          dimensionTotals[dimension].total += Number(score);
          dimensionTotals[dimension].count += 1;
        });
      });
      const dimensions = Object.entries(dimensionTotals).map(([dimension, values])=>({ dimension, score:values.total / values.count }));
      const totalScore = dimensions.reduce((sum, item)=>sum + item.score, 0);
      const colors = ['#2F6F62','#C99A3B','#C1613F','#4D7C8A','#8A6F9E','#789262','#B37A52'];
      let angle = 0;
      const slices = dimensions.map((item, index)=>{
        const start = angle;
        angle += item.score / totalScore * 360;
        return `${colors[index % colors.length]} ${start}deg ${angle}deg`;
      });
      const profile = el('div','wb-hse-profile');
      const donut = el('div','wb-donut'); donut.style.background = `conic-gradient(${slices.join(',')})`;
      const hole = el('div','wb-donut-hole');
      const average = totalScore / dimensions.length;
      const averageValue = document.createElement('strong'); averageValue.textContent = average.toFixed(2);
      const averageLabel = document.createElement('span'); averageLabel.textContent = 'average HSE score / 5';
      hole.appendChild(averageValue); hole.appendChild(averageLabel); donut.appendChild(hole);
      profile.appendChild(donut);
      const legend = el('div','wb-hse-legend');
      dimensions.forEach((item, index)=>{
        const percentage = item.score / totalScore * 100;
        const legendRow = el('div','wb-hse-legend-row');
        const swatch = el('span','wb-hse-swatch'); swatch.style.background = colors[index % colors.length];
        const name = el('span'); name.textContent = item.dimension;
        const score = el('span','wb-hse-legend-score'); score.textContent = `${item.score.toFixed(2)} · ${percentage.toFixed(1)}%`;
        const risk = el('span','wb-hse-risk'); risk.textContent = hseRisk(item.score);
        legendRow.appendChild(swatch); legendRow.appendChild(name); legendRow.appendChild(score); legendRow.appendChild(risk); legend.appendChild(legendRow);
      });
      profile.appendChild(legend); modal.appendChild(profile);
      const note = el('div','wb-modal-note'); note.textContent = `Overall HSE score: ${average.toFixed(2)} / 5 — ${hseRisk(average)}. Higher scores indicate a more positive workplace result. This profile does not diagnose depression.`;
      modal.appendChild(note);
    }

    const close = el('button','wb-btn ghost wb-close'); close.textContent='Close';
    close.addEventListener('click', ()=> set({ hrDetail:null }));
    modal.appendChild(close); bg.appendChild(modal);
    bg.addEventListener('click', event=>{ if(event.target===bg) bg.remove(); });
    document.getElementById('wb-root').appendChild(bg);
  }

  function renderDetailModal(record){
    const bg = el('div','wb-modal-bg');
    const modal = el('div','wb-modal');
    const h = el('h3'); h.textContent = 'Employee ' + record.employeeId;
    const meta = el('div','meta'); meta.textContent = formatDate(record.submittedAt);
    const score = record.pssScore !== undefined ? record.pssScore : pssScore(record.answers || {});
    const band = el('div','wb-note'); band.textContent = `PSS-10 score: ${score} / 40 — ${pssBand(score)}`;
    modal.appendChild(h); modal.appendChild(meta); modal.appendChild(band);

    if(record.hseScores){
      const hseHeading = el('div','wb-qnum'); hseHeading.textContent = 'HSE Management Standards evaluation'; hseHeading.style.marginTop='22px';
      modal.appendChild(hseHeading);
      const hseTable = document.createElement('table'); hseTable.className='wb-table';
      Object.entries(record.hseScores).forEach(([dimension, value])=>{
        const row = document.createElement('tr');
        const risk = record.hseRiskLevels && record.hseRiskLevels[dimension] ? record.hseRiskLevels[dimension] : hseRisk(value);
        row.innerHTML = `<td>${escapeHtml(dimension)}</td><td>${Number(value).toFixed(2)} / 5</td><td>${escapeHtml(risk)}</td>`;
        hseTable.appendChild(row);
      });
      modal.appendChild(hseTable);
    }

    const close = el('button','wb-btn ghost wb-close'); close.textContent='Close';
    close.addEventListener('click', ()=> set({ hrDetail:null }));
    modal.appendChild(close);
    bg.appendChild(modal);
    bg.addEventListener('click', e=>{ if(e.target===bg) set({ hrDetail:null }); });
    document.getElementById('wb-root').appendChild(bg);
  }

  // ---------- helpers ----------
  function el(tag, cls){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    return e;
  }
  function statBox(val,label){
    const b = el('div','wb-stat');
    const v = el('div','v'); v.textContent = val;
    const l = el('div','l'); l.textContent = label;
    b.appendChild(v); b.appendChild(l);
    return b;
  }
  function eyebrow(text){
    const e = el('div','wb-eyebrow');
    const dot = el('div','wb-pulse');
    const span = document.createElement('span'); span.textContent = text;
    e.appendChild(dot); e.appendChild(span);
    return e;
  }
  function h1(text){ const e = el('h1','wb-h1'); e.textContent = text; return e; }
  function sub(text){ const e = el('p','wb-sub'); e.textContent = text; return e; }
  function formatDate(iso){
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  const SCREENS = {
    entry: screenEntry,
    checking: screenChecking,
    quiz: screenQuiz,
    hse: screenHse,
    done: screenDone,
    error: screenError,
    hr: screenHr
  };

  render();
})();
</script>
</body>
</html>
